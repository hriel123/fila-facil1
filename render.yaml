services:
  - type: web
    name: fila-facil-api
    runtime: node
    region: virginia
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://hriel123.github.io,https://fila-facil-app.onrender.com
      - key: APP_URL
        value: https://fila-facil-app.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BREVO_API_KEY
        sync: false

  - type: web
    name: fila-facil-app
    runtime: static
    buildCommand: mkdir -p publico && cp *.html *.js *.css *.jpg favicon.png publico/
    staticPublishPath: publico
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

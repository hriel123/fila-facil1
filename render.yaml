services:
  - type: web
    name: fila-facil-api
    runtime: node
    region: virginia
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://hriel123.github.io,https://fila-facil-app.onrender.com

  - type: web
    name: fila-facil-app
    runtime: static
    buildCommand: mkdir -p publico && cp index.html app.html tv.html *.js *.css *.jpg favicon.png publico/
    staticPublishPath: publico
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
